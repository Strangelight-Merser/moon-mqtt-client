name: native client
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MOONBIT_ASYNC_CHECK_FD_LEAK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install broker (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mosquitto openssl libssl-dev
      - name: Install broker (macOS)
        if: runner.os == 'macOS'
        run: brew install mosquitto openssl@3
      - name: Install verified MoonBit baseline
        run: |
          ./scripts/install-moonbit-ci.sh fixed
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check and build
        run: |
          moon version --all
          moon update
          moon check --target native
          moon test --target native
          moon build --target native
      - name: Independent broker verification
        run: |
          python -m pip install -r tests/integration/requirements.txt
          MOON="$(command -v moon)" PYTHON="$(command -v python)" ./tests/integration/run.sh
      - name: Protocol faults and example consumers
        run: |
          MOON="$(command -v moon)" python tests/protocol_faults.py
          MOON="$(command -v moon)" python tests/scenario_smoke.py
          MOON="$(command -v moon)" python tests/consumer_smoke.py

  latest-compatibility:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install rolling stable MoonBit
        run: |
          ./scripts/install-moonbit-ci.sh latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Latest compatibility check
        run: |
          moon update
          moon check --target native
          moon test --target native
          moon build --target native
