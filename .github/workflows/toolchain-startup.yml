name: toolchain startup diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install mosquitto openssl@3
      - run: |
          ./scripts/install-moonbit-ci.sh fixed
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Build the unchanged source and capture plans
        run: |
          mkdir -p _build/toolchain-diagnostic
          moon update
          moon build --target native
          moon build --target native --dry-run > _build/toolchain-diagnostic/build-plan.log
          moon run examples/fault_driver --target native --dry-run > _build/toolchain-diagnostic/run-plan.log
      - name: Diagnose unchanged protocol test before and after compilation
        env:
          MOONBIT_ASYNC_CHECK_FD_LEAK: '1'
        run: |
          python - <<'PYCODE'
          import os,sys,subprocess,time,runpy,json
          from pathlib import Path
          root=Path.cwd(); out=root/"_build/toolchain-diagnostic";out.mkdir(parents=True,exist_ok=True)
          moon=os.environ.get("MOON","moon")
          records=[]
          for phase in ("cold", "warm"):
              if phase=="warm":
                  start=time.monotonic()
                  r=subprocess.run([moon,"run","examples/fault_driver","--target","native","--build-only"],capture_output=True,text=True)
                  (out/"warm-build.log").write_text(r.stdout+r.stderr)
                  records.append({"phase":"build-only","seconds":time.monotonic()-start,"code":r.returncode})
              start=time.monotonic()
              try:
                  runpy.run_path(str(root/"tests/protocol_faults.py"),run_name="__main__")
                  records.append({"phase":phase,"passed":True,"seconds":time.monotonic()-start})
              except subprocess.TimeoutExpired as e:
                  (out/(phase+"-stdout.log")).write_bytes(e.stdout or b"")
                  (out/(phase+"-stderr.log")).write_bytes(e.stderr or b"")
                  records.append({"phase":phase,"passed":False,"seconds":time.monotonic()-start,"error":str(e)})
              except Exception as e:
                  records.append({"phase":phase,"passed":False,"seconds":time.monotonic()-start,"error":repr(e)})
              print(json.dumps(records[-1]),flush=True)
              (out/"result.json").write_text(json.dumps(records,indent=2)+"\n")
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-startup-${{ github.sha }}
          path: _build/toolchain-diagnostic/
