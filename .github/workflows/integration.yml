name: native client integration
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    name: integration (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    env:
      MOONBIT_ASYNC_CHECK_FD_LEAK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install broker (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mosquitto openssl libssl-dev
      - name: Install broker (macOS)
        if: runner.os == 'macOS'
        run: brew install mosquitto openssl@3
      - name: Match localhost to IPv4 broker (Linux)
        if: runner.os == 'Linux'
        run: |
          echo 'precedence ::ffff:127.0.0.1/128 100' | sudo tee -a /etc/gai.conf
          python -c 'import socket; results=socket.getaddrinfo("localhost", None, 0, 0, 0, socket.AI_ADDRCONFIG); assert results[0][4][0] == "127.0.0.1"'
      - name: Install verified MoonBit baseline
        run: |
          ./scripts/install-moonbit-ci.sh fixed
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install acceptance dependencies
        run: python -m pip install -r tests/integration/requirements.txt
      - name: Shared Integration acceptance
        run: MOON="$(command -v moon)" PYTHON="$(command -v python)" ./scripts/check.sh integration
      - name: Preserve first-attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            _build/acceptance/
            !_build/acceptance/**/*.key
            !_build/acceptance/**/*.pem
            !_build/acceptance/**/*.sqlite3*
            !_build/acceptance/**/*.mqttrec
          if-no-files-found: error
          retention-days: 30

  r2-balanced-trace:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/r2-trace-hosted'
    name: R2 balanced trace A/B (macos-arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MOONBIT_ASYNC_CHECK_FD_LEAK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native crypto dependency
        run: brew install openssl@3
      - name: Install verified MoonBit baseline
        run: |
          ./scripts/install-moonbit-ci.sh fixed
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install acceptance dependencies
        run: python -m pip install -r tests/integration/requirements.txt
      - name: Run preregistered six-pair comparison
        run: python tests/diagnostics/trace_ab/run.py
      - name: Preserve every trial and protocol
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-balanced-trace-macos-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            _build/trace-ab-hosted/protocol.json
            _build/trace-ab-hosted/summary.json
            _build/trace-ab-hosted/benchmark_driver.exe
            _build/trace-ab-hosted/pair-*/result.json
            _build/trace-ab-hosted/pair-*/native.jsonl
            _build/trace-ab-hosted/pair-*/wire.jsonl
            _build/trace-ab-hosted/pair-*/sqlite.jsonl
            _build/trace-ab-hosted/pair-*/stderr.log
          if-no-files-found: error
          retention-days: 30
