name: macOS mTLS diagnosis
on:
  push:
    branches: [codex/macos-mtls-diagnostic]
    paths: ['scripts/diagnose-macos-mtls.py', '.github/workflows/macos-mtls-diagnostic.yml', 'third_party/async-tls/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        probe: [1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      MOONBIT_ASYNC_CHECK_FD_LEAK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unchanged dependencies
        run: |
          brew install mosquitto openssl@3
          ./scripts/install-moonbit-ci.sh fixed
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          python -m pip install -r tests/integration/requirements.txt
      - name: Original positive mTLS test on this image
        run: |
          moon update
          moon build --target native
          MOON="$(command -v moon)" python tests/integration/run.py IntegrationTest.test_mtls_qos1_roundtrip
      - name: Capture native TLS cause with registry 0.8.0
        if: always()
        run: |
          mkdir -p _build/mtls-diagnosis
          MOON="$(command -v moon)" python scripts/diagnose-macos-mtls.py 2>&1 | tee _build/mtls-diagnosis/diagnostic.log
      - name: Verify OpenSSL 3 source with unchanged original tests
        if: always()
        run: |
          moon build --target native
          MOON="$(command -v moon)" python tests/integration/run.py IntegrationTest.test_mtls_qos1_roundtrip IntegrationTest.test_mtls_tls13_only_qos1_roundtrip IntegrationTest.test_mtls_rejection_matrix
          cd third_party/async-tls
          moon test --target native
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtls-diagnosis-${{ github.sha }}-${{ matrix.probe }}
          path: _build/mtls-diagnosis/
          retention-days: 30
