name: macOS mTLS diagnosis
on:
  push:
    branches: [codex/macos-mtls-diagnostic]
    paths: ['scripts/diagnose-macos-mtls.py', '.github/workflows/macos-mtls-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unchanged dependencies
        run: |
          brew install mosquitto openssl@3
          ./scripts/install-moonbit-ci.sh fixed
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          python -m pip install -r tests/integration/requirements.txt
      - name: Capture native TLS cause with registry 0.8.0
        run: |
          mkdir -p _build/mtls-diagnosis
          MOON="$(command -v moon)" python scripts/diagnose-macos-mtls.py 2>&1 | tee _build/mtls-diagnosis/diagnostic.log
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtls-diagnosis-${{ github.sha }}
          path: _build/mtls-diagnosis/
          retention-days: 30
